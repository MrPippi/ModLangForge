name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate translation data
        run: npm run validate:data
      - run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Core coverage (>= 80%)
        run: npm run test:coverage -w @mlf/core
      - name: Typecheck site
        run: npm run typecheck -w @mlf/site
      - name: Build site
        run: npm run build
        env:
          PUBLIC_SUGGEST_ENABLED: 'true'
      - name: Worker typecheck and coverage
        run: npm run typecheck -w @mlf/worker && npm run test:coverage -w @mlf/worker
      - name: Prepare worker dev vars
        run: cp .dev.vars.example .dev.vars
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
